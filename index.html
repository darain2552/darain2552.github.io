body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  background: #0b0b0b;
  color: white;
  font-family: Arial, sans-serif;
}

h1 {
  color: #00ff88;
  font-size: 38px;
  text-align: center;
  margin: 25px 0;
}

.box {
  width: 100%;
  max-width: 650px;
  margin: auto;
  background: #181818;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 0 25px rgba(0, 255, 136, 0.08);
}

.key-title {
  text-align: center;
  color: #00ff88;
}

.center {
  text-align: center;
}

input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: 1px solid #333;
  outline: none;
  border-radius: 10px;
  background: #0d0d0d;
  color: white;
  font-size: 16px;
}

input:focus {
  border-color: #00ff88;
}

button {
  background: #00ff88;
  color: #000;
  border: 0;
  border-radius: 10px;
  padding: 13px 22px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px;
}

button:hover {
  opacity: 0.85;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.secondary {
  background: #333;
  color: white;
}

#chat {
  height: 420px;
  overflow-y: auto;
  background: #000;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
  border: 1px solid #222;
}

.message {
  margin: 12px 0;
  padding: 10px;
  border-radius: 10px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  color: #00ff88;
  background: #07150e;
}

.ai {
  color: #20aaff;
  background: #07131a;
}

.error {
  color: #ff5555;
  background: #1a0808;
}

.info {
  color: #aaa;
  font-size: 13px;
  text-align: center;
}

.status {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin: 8px;
}

.hidden {
  display: none !important;
}

.input-row {
  display: flex;
  gap: 8px;
}

.input-row input {
  flex: 1;
}

.input-row button {
  flex-shrink: 0;
}

  body {
    padding: 10px;

  h1 {
    font-size: 30px;

  .box {
    padding: 15px;
  }

  #chat {
    height: 55vh;
  }

  .input-row {
    flex-direction: column;
  }

  .input-row button {
    width: 100%;
    margin: 0;
  }

<body>

<h1>Darain Khan AI 🤖</h1>

<!-- API KEY SCREEN -->
<div id="keyBox" class="box">

  <h2 class="key-title">Darain Khan AI</h2>

  <p class="center">
    Apni Gemini API Key enter karo
  </p>

  <input
    id="apiKey"
    type="password"
    placeholder="Gemini API Key"
    autocomplete="off"
  >

  <div class="center">
    <button id="startButton" onclick="startAI()">
      Start AI
    </button>
  </div>

  <p class="info">
    Personal testing version
  </p>

</div>


<!-- CHAT SCREEN -->
<div id="chatBox" class="box hidden">

  <div id="chat"></div>

  <div id="status" class="status">
    AI ready nahi hai.
  </div>

  <div class="input-row">

    <input
      id="msg"
      type="text"
      placeholder="Sawal likho..."
      autocomplete="off"
    >

    <button id="sendButton" onclick="sendMsg()">
      Send
    </button>

  </div>

  <div class="center">

    <button
      class="secondary"
      onclick="changeKey()"
    >
      Change Key
    </button>

    <button
      class="secondary"
      onclick="clearChat()"
    >
      Clear Chat
    </button>

  </div>

</div>


<script>

/* =========================================
   CONFIG
========================================= */

const API_BASE =
  "https://generativelanguage.googleapis.com/v1beta";

let API_KEY =
  localStorage.getItem("darain_api_key") || "";

let MODEL_NAME = "";

let chatHistory = [];

let isSending = false;


/* =========================================
   PAGE LOAD
========================================= */

document.addEventListener("DOMContentLoaded", () => {

  const input =
    document.getElementById("msg");

  if (input) {

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMsg();

        }

      }
    );

  }


  if (API_KEY) {

    showChat();

    addAI(
      "AI start ho raha hai... model check kar raha hoon."
    );

    findModel();

  }

});


/* =========================================
   START AI
========================================= */

async function startAI() {

  const key =
    document
      .getElementById("apiKey")
      .value
      .trim();

  if (!key) {

    alert("Gemini API Key enter karo.");

    return;

  }


  API_KEY = key;

  localStorage.setItem(
    "darain_api_key",
    API_KEY
  );


  showChat();


  addAI(
    "AI start ho raha hai... model check kar raha hoon."
  );


  await findModel();

}


/* =========================================
   SHOW CHAT
========================================= */

function showChat() {

  document
    .getElementById("keyBox")
    .classList.add("hidden");

  document
    .getElementById("chatBox")
    .classList.remove("hidden");

}


/* =========================================
   FIND AVAILABLE MODEL
========================================= */

async function findModel() {

  if (!API_KEY) {

    addError(
      "API Key missing hai."
    );

    return false;

  }


  setStatus(
    "Gemini models check ho rahe hain..."
  );


  try {

    const response =
      await fetch(
        API_BASE + "/models",
        {
          method: "GET",

          headers: {
            "x-goog-api-key": API_KEY
          }
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      const message =
        data?.error?.message ||
        "API Key invalid hai.";

      addError(message);

      setStatus(
        "API connection failed."
      );

      return false;

    }


    const models =
      Array.isArray(data.models)
        ? data.models
        : [];


    const usable =
      models.filter(model => {

        const methods =
          model.supportedGenerationMethods || [];

        return methods.includes(
          "generateContent"
        );

      });


    if (usable.length === 0) {

      addError(
        "Is API Key ke liye generateContent wala koi Gemini model available nahi hai."
      );

      setStatus(
        "No usable model found."
      );

      return false;

    }


    /*
      MODEL PRIORITY

      1. gemini-2.5-flash
      2. gemini-2.5-flash-lite
      3. gemini-2.x flash
      4. Any other flash
      5. First usable model
    */

    function modelName(model) {

      return (
        model.name || ""
      ).toLowerCase();

    }


    let selected =
      usable.find(model =>
        modelName(model)
          .includes("gemini-2.5-flash")
      );


    if (!selected) {

      selected =
        usable.find(model =>
          modelName(model)
            .includes("gemini-2.5-flash-lite")
        );

    }


    if (!selected) {

      selected =
        usable.find(model => {

          const name =
            modelName(model);

          return (
            name.includes("gemini-2") &&
            name.includes("flash")
          );

        });

    }


    if (!selected) {

      selected =
        usable.find(model =>
          modelName(model)
            .includes("flash")
        );

    }


    if (!selected) {

      selected = usable[0];

    }


    MODEL_NAME =
      selected.name;


    const displayName =
      MODEL_NAME.replace(
        "models/",
        ""
      );


    addAI(
      "AI ready hai! 🤖\nModel: " +
      displayName
    );


    setStatus(
      "AI Online • " +
      displayName
    );


    return true;


  } catch (error) {

    addError(
      "Connection error: " +
      error.message
    );

    setStatus(
      "Internet/API connection error."
    );

    return false;

  }

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMsg() {

  if (isSending) {
    return;
  }


  const input =
    document.getElementById("msg");

  const msg =
    input.value.trim();


  if (!msg) {
    return;
  }


  if (!API_KEY) {

    addError(
      "Pehle API Key enter karo."
    );

    return;

  }


  addUser(msg);

  input.value = "";


  if (!MODEL_NAME) {

    const found =
      await findModel();

    if (!found) {
      return;
    }

  }


  isSending = true;

  setButtonsDisabled(true);


  const loadingId =
    "loading_" + Date.now();


  addLoading(
    loadingId
  );


  try {

    const url =
      API_BASE +
      "/" +
      MODEL_NAME +
      ":generateContent";


    /*
      Previous conversation + current message
    */

    const contents =
      [
        ...chatHistory,

        {
          role: "user",

          parts: [
            {
              text: msg
            }
          ]
        }
      ];


    const response =
      await fetch(
        url,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              API_KEY

          },

          body: JSON.stringify({

            contents: contents,

            generationConfig: {

              temperature: 0.7,

              maxOutputTokens: 2048

            }

          })

        }
      );


    const data =
      await response.json();


    removeElement(
      loadingId
    );


    if (!response.ok) {

      /*
        Agar selected model reject ho,
        models dobara check karo.
      */

      const errorMessage =
        data?.error?.message ||
        "Gemini API error.";

      addError(
        errorMessage
      );

      return;

    }


    const reply =
      data
        ?.candidates?.[0]
        ?.content?.parts
        ?.map(part => part.text || "")
        .join("")
        .trim();


    if (!reply) {

      addError(
        "AI ne koi response nahi diya."
      );

      return;

    }


    /*
      Conversation history save
    */

    chatHistory.push({

      role: "user",

      parts: [
        {
          text: msg
        }
      ]

    });


    chatHistory.push({

      role: "model",

      parts: [
        {
          text: reply
        }
      ]

    });


    /*
      History ko unnecessarily huge
      hone se bachao.
    */

    if (chatHistory.length > 20) {

      chatHistory =
        chatHistory.slice(-20);

    }


    addAI(reply);


  } catch (error) {

    removeElement(
      loadingId
    );


    addError(
      "Connection error: " +
      error.message
    );

  }


  isSending = false;

  setButtonsDisabled(false);

}


/* =========================================
   ADD USER MESSAGE
========================================= */

function addUser(text) {

  addMessage(
    "user",
    "Tum:",
    text
  );

}


/* =========================================
   ADD AI MESSAGE
========================================= */

function addAI(text) {

  addMessage(
    "ai",
    "AI:",
    text
  );

}


/* =========================================
   ADD ERROR
========================================= */

function addError(text) {

  addMessage(
    "error",
    "Error:",
    text
  );

}


/* =========================================
   ADD LOADING
========================================= */

function addLoading(id) {

  const chat =
    document.getElementById("chat");


  const element =
    document.createElement("p");


  element.id = id;

  element.className =
    "message ai";


  const bold =
    document.createElement("b");

  bold.textContent =
    "AI: ";


  element.appendChild(
    bold
  );


  element.appendChild(
    document.createTextNode(
      "Soch raha hoon..."
    )
  );


  chat.appendChild(
    element
  );


  scrollChat();

}


/* =========================================
   GENERIC MESSAGE
========================================= */

function addMessage(
  className,
  label,
  text
) {

  const chat =
    document.getElementById("chat");


  const element =
    document.createElement("p");


  element.className =
    "message " +
    className;


  const bold =
    document.createElement("b");


  bold.textContent =
    label + " ";


  element.appendChild(
    bold
  );


  element.appendChild(
    document.createTextNode(
      String(text)
    )
  );


  chat.appendChild(
    element
  );


  scrollChat();

}


/* =========================================
   REMOVE ELEMENT
========================================= */

function removeElement(id) {

  const element =
    document.getElementById(id);


  if (element) {

    element.remove();

  }

}


/* =========================================
   SCROLL CHAT
========================================= */

function scrollChat() {

  const chat =
    document.getElementById("chat");


  if (!chat) {
    return;
  }


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

  const status =
    document.getElementById("status");


  if (status) {

    status.textContent =
      text;

  }

}


/* =========================================
   DISABLE BUTTONS
========================================= */

function setButtonsDisabled(
  disabled
) {

  const sendButton =
    document.getElementById(
      "sendButton"
    );


  if (sendButton) {

    sendButton.disabled =
      disabled;

  }

}


/* =========================================
   CHANGE API KEY
========================================= */

function changeKey() {

  localStorage.removeItem(
    "darain_api_key"
  );


  API_KEY = "";

  MODEL_NAME = "";

  chatHistory = [];


  location.reload();

}


/* =========================================
   CLEAR CHAT
========================================= */

function clearChat() {

  const chat =
    document.getElementById("chat");


  chat.innerHTML = "";


  chatHistory = [];


  addAI(
    "Chat clear kar diya gaya hai. 🤖"
  );

}


/* =========================================
   SECURITY NOTE
========================================= */

/*
  IMPORTANT:

  Browser mein Gemini API Key rakhna
  production/public website ke liye
  secure nahi hai.

  Ye version personal testing ke liye hai.

  Public website ke liye:
  Browser -> Your Backend -> Gemini API

  architecture use karna chahiye.
*/

</script>

   SEND MESSAGE
========================================= */

async function sendMsg() {

  if (isSending) {
    return;
  }


  const input =
    document.getElementById("msg");

  const msg =
    input.value.trim();


  if (!msg) {
    return;
  }


  if (!API_KEY) {

    addError(
      "Pehle API Key enter karo."
    );

    return;

  }


  addUser(msg);

  input.value = "";


  if (!MODEL_NAME) {

    const found =
      await findModel();

    if (!found) {
      return;
    }

  }


  isSending = true;

  setButtonsDisabled(true);


  const loadingId =
    "loading_" + Date.now();


  addLoading(
    loadingId
  );


  try {

    const url =
      API_BASE +
      "/" +
      MODEL_NAME +
      ":generateContent";


    /*
      Previous conversation + current message
    */

    const contents =
      [
        ...chatHistory,

        {
          role: "user",

          parts: [
            {
              text: msg
            }
          ]
        }
      ];


    const response =
      await fetch(
        url,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              API_KEY

          },

          body: JSON.stringify({

            contents: contents,

            generationConfig: {

              temperature: 0.7,

              maxOutputTokens: 2048

            }

          })

        }
      );


    const data =
      await response.json();


    removeElement(
      loadingId
    );


    if (!response.ok) {

      /*
        Agar selected model reject ho,
        models dobara check karo.
      */

      const errorMessage =
        data?.error?.message ||
        "Gemini API error.";

      addError(
        errorMessage
      );

      return;

    }


    const reply =
      data
        ?.candidates?.[0]
        ?.content?.parts
        ?.map(part => part.text || "")
        .join("")
        .trim();


    if (!reply) {

      addError(
        "AI ne koi response nahi diya."
      );

      return;

    }


    /*
      Conversation history save
    */

    chatHistory.push({

      role: "user",

      parts: [
        {
          text: msg
        }
      ]

    });


    chatHistory.push({

      role: "model",

      parts: [
        {
          text: reply
        }
      ]

    });


    /*
      History ko unnecessarily huge
      hone se bachao.
    */

    if (chatHistory.length > 20) {

      chatHistory =
        chatHistory.slice(-20);

    }


    addAI(reply);


  } catch (error) {

    removeElement(
      loadingId
    );


    addError(
      "Connection error: " +
      error.message
    );

  }


  isSending = false;

  setButtonsDisabled(false);

}


/* =========================================
   ADD USER MESSAGE
========================================= */

function addUser(text) {

  addMessage(
    "user",
    "Tum:",
    text
  );

}


/* =========================================
   ADD AI MESSAGE
========================================= */

function addAI(text) {

  addMessage(
    "ai",
    "AI:",
    text
  );

}


/* =========================================
   ADD ERROR
========================================= */

function addError(text) {

  addMessage(
    "error",
    "Error:",
    text
  );

}


/* =========================================
   ADD LOADING
========================================= */

function addLoading(id) {

  const chat =
    document.getElementById("chat");


  const element =
    document.createElement("p");


  element.id = id;

  element.className =
    "message ai";


  const bold =
    document.createElement("b");

  bold.textContent =
    "AI: ";


  element.appendChild(
    bold
  );


  element.appendChild(
    document.createTextNode(
      "Soch raha hoon..."
    )
  );


  chat.appendChild(
    element
  );


  scrollChat();

}


/* =========================================
   GENERIC MESSAGE
========================================= */

function addMessage(
  className,
  label,
  text
) {

  const chat =
    document.getElementById("chat");


  const element =
    document.createElement("p");


  element.className =
    "message " +
    className;


  const bold =
    document.createElement("b");


  bold.textContent =
    label + " ";


  element.appendChild(
    bold
  );


  element.appendChild(
    document.createTextNode(
      String(text)
    )
  );


  chat.appendChild(
    element
  );


  scrollChat();

}


/* =========================================
   REMOVE ELEMENT
========================================= */

function removeElement(id) {

  const element =
    document.getElementById(id);


  if (element) {

    element.remove();

  }

}


/* =========================================
   SCROLL CHAT
========================================= */

function scrollChat() {

  const chat =
    document.getElementById("chat");


  if (!chat) {
    return;
  }


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

  const status =
    document.getElementById("status");


  if (status) {

    status.textContent =
      text;

  }

}


/* =========================================
   DISABLE BUTTONS
========================================= */

function setButtonsDisabled(
  disabled
) {

  const sendButton =
    document.getElementById(
      "sendButton"
    );


  if (sendButton) {

    sendButton.disabled =
      disabled;

  }

}


/* =========================================
   CHANGE API KEY
========================================= */

function changeKey() {

  localStorage.removeItem(
    "darain_api_key"
  );


  API_KEY = "";

  MODEL_NAME = "";

  chatHistory = [];


  location.reload();

}


/* =========================================
   CLEAR CHAT
========================================= */

function clearChat() {

  const chat =
    document.getElementById("chat");


  chat.innerHTML = "";


  chatHistory = [];


  addAI(
    "Chat clear kar diya gaya hai. 🤖"
  );

}
