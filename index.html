<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darain Khan AI</title>
<style>
body { font-family: Arial; background: #0f172a; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
header { background: #1e293b; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
#chat { flex: 1; padding: 15px; overflow-y: auto; }
.msg { margin: 8px 0; padding: 10px; border-radius: 10px; max-width: 80%; }
.user { background: #2563eb; margin-left: auto; }
.ai { background: #334155; margin-right: auto; }
#inputArea { display: flex; padding: 10px; background: #1e293b; }
#userInput { flex: 1; padding: 10px; border: none; border-radius: 8px; }
#sendBtn { padding: 10px 15px; margin-left: 8px; border: none; background: #2563eb; color: white; border-radius: 8px; cursor: pointer; }
#keyBox { padding: 20px; text-align: center; }
#apiKey { padding: 10px; width: 80%; border-radius: 8px; border: none; }
</style>
</head>
<body>
<header>Darain Khan AI 🤖</header>

<div id="keyBox">
  <h3>Pehle API Key daalo</h3>
  <input type="password" id="apiKey" placeholder="Apni Gemini API Key yahan paste karo">
  <button id="saveKeyBtn" style="padding:10px; margin-top:10px; background:green; color:white; border:none; border-radius:8px;">Start Chat</button>
</div>

<div id="chat" style="display:none;"></div>
<div id="inputArea" style="display:none;">
  <input type="text" id="userInput" placeholder="Apna sawal yahan likho...">
  <button id="sendBtn">Send</button>
</div>

<script>
let API_KEY = "";
const chatBox = document.getElementById('chat');
const inputArea = document.getElementById('inputArea');
const keyBox = document.getElementById('keyBox');

document.getElementById('saveKeyBtn').onclick = () => {
  API_KEY = document.getElementById('apiKey').value.trim();
  if(API_KEY) {
    keyBox.style.display = 'none';
    chatBox.style.display = 'block';
    inputArea.style.display = 'flex';
  }
}

async function sendMessage() {
  const userInput = document.getElementById('userInput');
  const message = userInput.value.trim();
  if(!message) return;
  
  addMessage(message, 'user');
  userInput.value = '';
  addMessage("Socha ja raha hai...", 'ai');

  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: message }] })] })
  });
  
  const data = await response.json();
  chatBox.lastChild.remove();
  addMessage(data.candidates[0].content.parts[0].text, 'ai');
}

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = `msg ${sender}`;
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('userInput').onkeypress = (e) => { if(e.key === 'Enter') sendMessage() }
</script>
</body>
</html>
