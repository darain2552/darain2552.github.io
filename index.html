<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darain Khan AI 🤖</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#0b0b0b;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  color:#00ff88;
  font-size:42px;
  margin:35px 0;
}

.box{
  max-width:600px;
  margin:auto;
  background:#181818;
  padding:25px;
  border-radius:18px;
}

input{
  width:100%;
  padding:15px;
  margin:10px 0;
  border:0;
  border-radius:10px;
  font-size:16px;
}

button{
  background:#00ff88;
  color:#000;
  border:0;
  border-radius:10px;
  padding:14px 25px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
}

#chat{
  height:380px;
  overflow-y:auto;
  background:#000;
  border-radius:12px;
  padding:15px;
  text-align:left;
  margin-bottom:15px;
}

.user{
  color:#00ff88;
  line-height:1.6;
}

.ai{
  color:#20aaff;
  line-height:1.6;
}

.error{
  color:#ff5555;
  line-height:1.6;
}

.info{
  color:#aaa;
  font-size:13px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<h1>Darain Khan AI 🤖</h1>

<div id="keyBox" class="box">

  <h2>Darain Khan AI</h2>

  <p>Apni Gemini API Key enter karo</p>

  <input
    id="apiKey"
    type="password"
    placeholder="Gemini API Key"
  >

  <button onclick="startAI()">
    Start AI
  </button>

  <p class="info">
    Ye personal testing version hai.
  </p>

</div>


<div id="chatBox" class="box hidden">

  <div id="chat"></div>

  <input
    id="msg"
    type="text"
    placeholder="Sawal likho..."
    onkeydown="if(event.key==='Enter') sendMsg()"
  >

  <button onclick="sendMsg()">
    Send
  </button>

  <button onclick="changeKey()">
    Change Key
  </button>

</div>


<script>

let API_KEY = localStorage.getItem("darain_api_key");

let MODEL_NAME = null;


/* -----------------------------
   Start AI
----------------------------- */

async function startAI(){

  const key =
    document.getElementById("apiKey").value.trim();

  if(!key){

    alert("API Key enter karo.");

    return;
  }

  API_KEY = key;

  localStorage.setItem(
    "darain_api_key",
    API_KEY
  );

  document.getElementById("keyBox")
    .classList.add("hidden");

  document.getElementById("chatBox")
    .classList.remove("hidden");

  addAI(
    "AI start ho raha hai... model check kar raha hoon."
  );

  await findModel();

}


/* -----------------------------
   Existing key
----------------------------- */

if(API_KEY){

  document.getElementById("keyBox")
    .classList.add("hidden");

  document.getElementById("chatBox")
    .classList.remove("hidden");

  findModel();

}


/* -----------------------------
   Find available model
----------------------------- */

async function findModel(){

  try{

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models",
      {
        method:"GET",
        headers:{
          "x-goog-api-key":API_KEY
        }
      }
    );

    const data = await response.json();

    if(!response.ok){

      addError(
        data?.error?.message ||
        "API key check failed."
      );

      return;
    }


    const models = data.models || [];


    const usable =
      models.filter(model => {

        const methods =
          model.supportedGenerationMethods || [];

        return methods.includes(
          "generateContent"
        );

      });


    if(usable.length === 0){

      addError(
        "Is API key ke liye generateContent model available nahi hai."
      );

      return;
    }


    /*
      Prefer Flash models.
      Agar Flash na mile to
      pehla usable model use hoga.
    */

    const flash =
      usable.find(model =>
        (model.name || "")
        .toLowerCase()
        .includes("flash")
      );


    MODEL_NAME =
      flash?.name || usable[0].name;


    addAI(
      "AI ready hai! Model: " +
      MODEL_NAME.replace("models/","")
    );


  }catch(error){

    addError(
      "Connection error: " +
      error.message
    );

  }

}


/* -----------------------------
   Send message
----------------------------- */

async function sendMsg(){

  const input =
    document.getElementById("msg");

  const msg =
    input.value.trim();

  if(!msg) return;


  addUser(msg);

  input.value = "";


  if(!MODEL_NAME){

    await findModel();

  }


  if(!MODEL_NAME){

    addError(
      "AI model available nahi mila."
    );

    return;
  }


  const loadingId =
    "loading_" + Date.now();


  document.getElementById("chat").innerHTML +=
    `<p class="ai" id="${loadingId}">
      <b>AI:</b> Soch raha hoon...
    </p>`;


  try{

    const url =
      "https://generativelanguage.googleapis.com/v1beta/" +
      MODEL_NAME +
      ":generateContent";


    const response =
      await fetch(url,{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          "x-goog-api-key":
            API_KEY
        },

        body:JSON.stringify({

          contents:[
            {
              role:"user",

              parts:[
                {
                  text:msg
                }
              ]
            }
          ]

        })

      });


    const data =
      await response.json();


    document
      .getElementById(loadingId)
      ?.remove();


    if(!response.ok){

      addError(
        data?.error?.message ||
        "Gemini API error."
      );

      return;
    }


    const reply =
      data
      ?.candidates?.[0]
      ?.content?.parts?.[0]
      ?.text;


    if(reply){

      addAI(reply);

    }else{

      addError(
        "AI ne koi response nahi diya."
      );

    }


  }catch(error){

    document
      .getElementById(loadingId)
      ?.remove();

    addError(
      "Connection error: " +
      error.message
    );

  }

}


/* -----------------------------
   UI functions
----------------------------- */

function addUser(text){

  document.getElementById("chat")
    .innerHTML +=
    `<p class="user">
      <b>Tum:</b> ${escapeHTML(text)}
    </p>`;

  scrollChat();

}


function addAI(text){

  document.getElementById("chat")
    .innerHTML +=
    `<p class="ai">
      <b>AI:</b> ${escapeHTML(text)}
    </p>`;

  scrollChat();

}


function addError(text){

  document.getElementById("chat")
    .innerHTML +=
    `<p class="error">
      <b>Error:</b> ${escapeHTML(text)}
    </p>`;

  scrollChat();

}


function scrollChat(){

  const chat =
    document.getElementById("chat");

  chat.scrollTop =
    chat.scrollHeight;

}


function changeKey(){

  localStorage.removeItem(
    "darain_api_key"
  );

  API_KEY = null;

  MODEL_NAME = null;

  location.reload();

}


function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
